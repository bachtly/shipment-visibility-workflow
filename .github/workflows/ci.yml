name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shipvis
          POSTGRES_PASSWORD: shipvis
          POSTGRES_DB: shipvis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shipvis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DBOS_SYSTEM_DATABASE_URL: postgresql+psycopg://shipvis:shipvis@localhost:5432/shipvis
      DATABASE_URL: postgresql+psycopg://shipvis:shipvis@localhost:5432/shipvis
      DBOS_CONDUCTOR_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Unit tests (domain only, no DB required)
        working-directory: backend
        run: pytest tests/test_domain.py -v

      - name: Integration tests
        working-directory: backend
        run: pytest tests/test_api.py -v -m integration
        continue-on-error: true  # flaky if DBOS init is slow; remove once stable

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  infra:
    name: Infra — terragrunt fmt + plan (dev)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10"

      - name: Install Terragrunt
        run: |
          curl -sL https://github.com/gruntwork-io/terragrunt/releases/download/v0.68.0/terragrunt_linux_amd64 \
            -o /usr/local/bin/terragrunt && chmod +x /usr/local/bin/terragrunt

      - name: HCL format check
        working-directory: infra
        run: terragrunt hclfmt --check --diff

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/

      - name: Plan (dev)
        working-directory: infra/live/dev
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          DBOS_CONDUCTOR_KEY: ${{ secrets.DBOS_CONDUCTOR_KEY }}
        run: terragrunt plan -out=tfplan
        continue-on-error: true  # no Azure creds on forks
