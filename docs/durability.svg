<rect x="0" y="0" width="780" height="440" rx="16" fill="#faf8f4" stroke="#e7e2d8"/>
<rect x="22" y="22" width="44" height="5" rx="2.5" fill="#0f766e"/>
<text x="22" y="52" font-size="20" font-weight="700" fill="#1f2937">Durability</text>
<text x="22" y="72" font-size="12.5" fill="#6b7280" letter-spacing="0.3">kill the backend mid-flight — DBOS resumes from the last checkpoint</text>
<g filter="url(#sh)"><rect x="60" y="100" width="160" height="42" rx="11" fill="#d7f2ee" stroke="#0f766e" stroke-width="1.6"/></g><text x="140.0" y="126.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#0b5953">Frontend</text><line x1="140" y1="142" x2="140" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><g filter="url(#sh)"><rect x="310" y="100" width="160" height="42" rx="11" fill="#dbe6ff" stroke="#1d4ed8" stroke-width="1.6"/></g><text x="390.0" y="126.0" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="14" font-weight="700" fill="#1742a8">shipment_workflow</text><line x1="390" y1="142" x2="390" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><g filter="url(#sh)"><rect x="560" y="100" width="160" height="42" rx="11" fill="#e9eef5" stroke="#475569" stroke-width="1.6"/></g><text x="640.0" y="126.0" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#334155">Postgres / DBOS</text><line x1="640" y1="142" x2="640" y2="410" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="4 4"/><line x1="140" y1="168" x2="390" y2="168" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr)"/><text x="265.0" y="161" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" font-weight="600" fill="#0f766e">DBOS.send(event)</text><line x1="390" y1="210" x2="640" y2="210" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arr)"/><text x="515.0" y="203" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" font-weight="600" fill="#1d4ed8">checkpoint step</text><rect x="300" y="226" width="320" height="44" rx="9" fill="#fbdcdc" stroke="#b91c1c" stroke-width="1.3"/><text x="460" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#8f1414">backend killed</text><text x="460" y="262" text-anchor="middle" font-size="11" fill="#8f1414">then restarted</text><line x1="640" y1="312" x2="390" y2="312" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)" stroke-dasharray="5 4"/><text x="515.0" y="305" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" font-weight="600" fill="#475569">recover last checkpoint</text><path d="M 390 344 h 64 v 26 h -60" fill="none" stroke="#1d4ed8" stroke-width="1.7" marker-end="url(#arr)"/><text x="462" y="362" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" font-weight="600" fill="#1742a8">resume where it stopped</text><line x1="390" y1="400" x2="140" y2="400" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr)"/><text x="265.0" y="393" text-anchor="middle" font-family="ui-monospace,'SF Mono','Cascadia Code',Consolas,Menlo,monospace" font-size="10.5" font-weight="600" fill="#0f766e">status via SSE</text></svg>